<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인스타 메이커</title>
<style>
:root {
  --bg: #f4f4f6;
  --card: #fff;
  --ink: #16161a;
  --mute: #76767f;
  --line: #e2e2e8;
  --acc: #e1306c;
  --phone: #fff;
  --fill: #eff0f4;
  --pill: #d6d9f0;
  --blue: #4a5cf6;
}
* {
  box-sizing: border-box;
}
html {
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 -apple-system, "SF Pro Text",
    "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  display: flex;
  gap: 6px;
  padding: 10px 12px;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.top button {
  flex: 1;
  padding: 10px;
  border: 0;
  border-radius: 10px;
  background: var(--card);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
}
.top button.on {
  background: var(--acc);
  color: #fff;
}
main {
  max-width: 520px;
  margin: 0 auto;
  padding: 12px;
}
.card {
  background: var(--card);
  border-radius: 14px;
  padding: 14px;
  margin-bottom: 12px;
}
h2 {
  font-size: 16px;
  margin: 0 0 10px;
}
label {
  display: block;
  font-size: 13px;
  color: var(--mute);
  margin: 8px 0 3px;
}
input, textarea {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--bg);
  color: var(--ink);
  font: inherit;
}
textarea {
  resize: vertical;
  min-height: 64px;
}
.row {
  display: flex;
  gap: 8px;
}
.row > * {
  flex: 1;
}
.btn {
  padding: 10px 14px;
  border: 0;
  border-radius: 10px;
  background: var(--acc);
  color: #fff;
  font: inherit;
  font-weight: 600;
  margin-top: 10px;
}
.btn.g {
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
}
.item {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 8px 0;
  border-top: 1px solid var(--line);
}
.item img {
  width: 48px;
  height: 48px;
  object-fit: cover;
  border-radius: 8px;
}
.item span {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 13px;
}
.item button {
  border: 0;
  background: none;
  color: var(--mute);
  font-size: 18px;
  padding: 4px 8px;
}
.hint {
  font-size: 12px;
  color: var(--mute);
}
.wrap {
  overflow-x: auto;
}

/* 인스타그램 프로필 미리보기 */
.phone {
  width: 100%;
  max-width: 390px;
  margin: 0 auto;
  background: var(--phone);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  min-height: 780px;
  display: flex;
  flex-direction: column;
}
.sb {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 30px 4px 36px;
  font-size: 17px;
  font-weight: 600;
}
.sb > span {
  display: flex;
  gap: 6px;
  align-items: center;
}
.bat {
  position: relative;
  width: 26px;
  height: 13px;
  border-radius: 4px;
  background: var(--line);
  overflow: hidden;
  text-align: center;
  font-size: 9px;
  line-height: 13px;
  font-weight: 700;
}
.bat b {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  background: var(--ink);
}
.bat i {
  position: relative;
  font-style: normal;
}
.ct {
  flex: 1;
  min-height: 0;
}
.ph {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 16px 6px;
  font-weight: 700;
}
.ph svg {
  width: 28px;
  height: 28px;
  display: block;
}
.pid {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 22px;
  justify-content: center;
}
.pid b {
  font-weight: 700;
}
.pid svg {
  width: 18px;
  height: 18px;
}
.dot {
  display: inline-block;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #f33;
}
.hd2 {
  display: flex;
  gap: 18px;
  padding: 0 16px;
  align-items: flex-start;
}
.pav {
  position: relative;
  flex: none;
  width: 88px;
  height: 88px;
  margin-top: 12px;
}
.pav .av {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
}
.pav.ring {
  padding: 4px;
  border-radius: 50%;
  background: linear-gradient(35deg, #ffd776, #f56040, #c13584, #833ab4, #5851db);
}
.pav.ring .av {
  width: 100%;
  height: 100%;
  border: 3px solid var(--phone);
}
.pav.seen {
  background: #c7c7cc;
}
.ph0 {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--fill);
  color: var(--blue);
}
.note {
  position: absolute;
  left: -4px;
  top: -26px;
  max-width: 120px;
  padding: 7px 12px;
  border-radius: 16px;
  background: var(--phone);
  box-shadow: 0 2px 10px #0002;
  font-size: 13px;
  color: var(--mute);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  z-index: 2;
}
.pr {
  flex: 1;
  padding-top: 0;
}
.nm {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 8px;
}
.stats2 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  text-align: center;
}
.stats2 div {
  font-size: 14px;
}
.stats2 b {
  display: block;
  font-size: 18px;
  font-weight: 600;
}
.bi {
  padding: 12px 16px 0;
  font-size: 14px;
  white-space: pre-wrap;
}
.ab {
  display: flex;
  gap: 8px;
  padding: 16px;
}
.ab div {
  flex: 1;
  display: flex;
  justify-content: center;
  padding: 10px;
  border-radius: 8px;
  background: var(--fill);
  font-weight: 600;
  font-size: 14px;
}
.ab .sm {
  flex: none;
  width: 48px;
}
.ab svg {
  width: 22px;
  height: 22px;
}
