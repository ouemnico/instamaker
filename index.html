.ar img,.ar i{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--fill);display:flex;align-items:center;justify-content:center;font-style:normal;flex:none}
.ar span{flex:1;line-height:1.3}.ar small{color:var(--mute)}
.ar u{text-decoration:none;color:var(--blue);font-weight:700}
.hd2{margin-top:10px}.pav{margin-top:2px}.pr{padding-top:20px}.note{top:-16px}
.pav .av{position:relative;z-index:1}
.pav.ring::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.pav.ring .av{border:3px solid var(--phone);cursor:pointer}
.sadd{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;border:3px solid var(--phone);display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;z-index:3;cursor:pointer}
.svl2{position:absolute;top:6px;left:8px;right:8px;display:flex;gap:4px;z-index:2}
.svl2 b{flex:1;height:3px;border-radius:2px;background:#fff5}
.svl2 b.f{background:#fff}
.svl2 b.a{background:linear-gradient(#fff,#fff) no-repeat #fff5;background-size:0 100%;animation:fill 5s linear forwards}
@keyframes fill{to{background-size:100% 100%}}
.svh{z-index:2;top:16px}.svh small{font-weight:400;opacity:.8}
.scap{position:absolute;left:16px;right:16px;bottom:24px;text-align:center;color:#fff;font-size:16px;text-shadow:0 1px 4px #000}

<div class="top"><button id="t1" class="on">편집</button><button id="t2">미리보기</button></div>
<main>
<section id="edit">
  <div class="card">
    <h2>계정</h2>
    <select id="accSel" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit"></select>
    <div class="row"><button class="btn" id="accAdd">계정 추가</button><button class="btn g" id="accDel">이 계정 삭제</button></div>
    <p class="hint">선택한 계정이 아래 편집과 미리보기에 적용돼요. 미리보기에서는 아이디 옞 화살표를 눌러 바꿀 수 있어요.</p>
  </div>
  <div class="card">
    <h2>프로필</h2>
    <label>프로필 사진</label><input type="file" accept="image/*" id="avIn">
    <label>아이디</label><input id="id" placeholder="my_account">
    <label>이름</label><input id="name" placeholder="표시 이름">
    <label>소개글</label><textarea id="bio"></textarea>
    <label>노트 (프로필 말풍선)</label><input id="note" placeholder="호기심 폭발...">
    <div class="row"><div><label>상태바 시각</label><input id="time" placeholder="9:41"></div><div><label>배터리 %</label><input id="batt" placeholder="100"></div></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lock" style="width:auto"> 비공개 계정 (자물쇠 표시)</label>
    <label>미리보기 모서리</label><select id="shape" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit"><option value="round">둥글게</option><option value="sq">각지게</option></select>
    <div class="row"><div><label>팔로워</label><input id="fo" value="0"></div><div><label>팔로잉</label><input id="fi" value="0"></div></div>
    <p class="hint">숫자 대신 1.2만처럼 글자도 넣을 수 있어요.</p>
  </div>
  <div class="card">
    <h2>게시물</h2>
    <label>사진</label><input type="file" accept="image/*" id="pIn">
    <label>내용</label><textarea id="pCap"></textarea>
    <div class="row"><div><label>좋아요</label><input id="pLk" value="0"></div><div><label>작성일</label><input id="pDt" placeholder="2시간 전"></div></div>
    <button class="btn" id="pAdd">게시물 추가</button>
    <div id="pList"></div>
  </div>
  <div class="card">
    <h2>하이라이트</h2>
    <label>커버 사진</label><input type="file" accept="image/*" id="hIn">
    <label>이름</label><input id="hName" placeholder="여행">
    <button class="btn" id="hAdd">하이라이트 추가</button>
    <div id="hList"></div>
  </div>
  <div class="card">
    <h2>스토리</h2>
    <label>사진</label><input type="file" accept="image/*" id="sIn">
    <label>문구 (선택)</label><input id="sCap">
    <label>가수 (선택)</label><input id="sAr"><label>노래 제목 (선택)</label><input id="sSo">
    <label>시간</label><input id="sTm" placeholder="방금 전">
    <button class="btn" id="sAdd">스토리 추가</button>
    <div id="sList"></div>
  </div>
  <div class="card">
    <h2>저장</h2>
    <p class="hint">내용은 이 브라우저에 자동 저장돼요. 사진이 많으면 저장이 안 될 수 있으니 백업 파일을 받아두세요.</p>
    <div class="row"><button class="btn g" id="exp">백업 받기</button><button class="btn g" id="imp">백업 불러오기</button></div>
    <input type="file" id="impIn" accept=".json" hidden>
    <button class="btn g" id="reset" style="width:100%">전체 초기화</button>
  </div>
</section>
<section id="prev" hidden><div class="wrap"><div class="phone" id="phone"></div></div></section>
</main>
