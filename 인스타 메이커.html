<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인스타 메이커</title>
<style>
:root{--bg:#f4f4f6;--card:#fff;--ink:#16161a;--mute:#76767f;--line:#e2e2e8;--acc:#e1306c;--phone:#fff;--box-sizing:border-box;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101013;--card:#1b1b20;--ink:#f1f1f4;--mute:#9a9aa5;--line:#2c2c34;--phone:#000}}
:root[data-theme="dark"]{--bg:#101013;--card:#1b1b20;--ink:#f1f1f4;--mute:#9a9aa5;--line:#2c2c34;--phone:#000}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,"SF Pro Text","Apple SD Gothic Neo","AppleSDGothicNeo","Noto Sans KR","Malgun Gothic",sans-serif}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:6px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.top button{flex:1;padding:10px;border:0;border-radius:10px;background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.top button.on{background:var(--acc);color:#fff}
main{max-width:520px;margin:0 auto;padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:13px;color:var(--mute);margin:8px 0 3px}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
textarea{resize:vertical;min-height:64px}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:10px 14px;border:0;border-radius:10px;background:var(--acc);color:#fff;font:inherit;font-weight:600;margin-top:10px}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.item{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.item span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.item button{border:0;background:none;color:var(--mute);font-size:18px;padding:4px 8px}
.hint{font-size:12px;color:var(--mute)}
.wrap{overflow-x:auto}
/* phone */
.phone{width:100%;max-width:390px;margin:0 auto;background:var(--phone);border:1px solid var(--line);border-radius:28px;overflow:hidden;min-height:620px;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;padding:12px 20px 4px;font-size:13px;font-weight:700}
.nav{display:flex;align-items:center;gap:10px;padding:8px 16px;font-weight:700;font-size:17px}
.nav .back{border:0;background:none;color:var(--ink);font-size:22px;padding:0 6px 0 0}
.head{display:flex;align-items:center;gap:22px;padding:8px 16px}
.av{width:82px;height:82px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.stats{display:flex;flex:1;justify-content:space-around;text-align:center;font-size:13px}
.stats b{display:block;font-size:17px}
.bio{padding:4px 16px 10px;font-size:14px;white-space:pre-wrap}
.bio b{display:block}
.acts{display:flex;gap:6px;padding:0 16px 12px}
.acts div{flex:1;text-align:center;padding:7px;border-radius:8px;background:var(--line);font-size:13px;font-weight:600}
.hl{display:flex;gap:14px;padding:0 16px 12px;overflow-x:auto}
.hl div{text-align:center;font-size:12px;flex:none;width:64px}
.hl img{width:62px;height:62px;border-radius:50%;object-fit:cover;border:1px solid var(--line);padding:2px;display:block;margin:0 auto 3px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;border-top:1px solid var(--line)}
.grid img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block;cursor:pointer}
.post .who{display:flex;align-items:center;gap:8px;padding:8px 14px;font-weight:700;font-size:14px}
.post .who img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.post>img{width:100%;display:block}
.post .ic{padding:8px 14px;font-size:20px;letter-spacing:10px}
.post .tx{padding:0 14px 14px;font-size:14px;white-space:pre-wrap}
.post .dt{color:var(--mute);font-size:12px;padding:0 14px 14px}
.empty{padding:40px 20px;text-align:center;color:var(--mute);font-size:14px}
.ptabs{display:flex;border-top:1px solid var(--line)}
.ptabs div{flex:1;display:flex;justify-content:center;padding:10px;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer}
.ptabs .on{color:var(--ink);border-bottom-color:var(--ink)}
.btm{margin-top:auto;display:flex;justify-content:space-around;align-items:center;padding:10px 0 16px;border-top:1px solid var(--line);background:var(--phone)}
.btm div{padding:4px 10px;display:flex;color:var(--ink);cursor:pointer}
.btm img,.btm i{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--line);display:block}
.btm .on img,.btm .on i{outline:2px solid var(--ink);outline-offset:1px}
.btm .on svg{stroke-width:2.8}
.sbox{flex:1;background:var(--line);border-radius:10px;padding:8px 12px;font-size:14px;color:var(--mute);font-weight:400}
.reel{position:relative;height:520px;background:#000;margin-bottom:2px;overflow:hidden}.reel img{width:100%;height:100%;object-fit:cover}
.rc{position:absolute;left:12px;bottom:14px;right:70px;color:#fff;font-size:13px;text-shadow:0 1px 3px #000}
.rs{position:absolute;right:12px;bottom:60px;color:#fff;text-align:center;font-size:13px}
.sv{position:relative;height:560px;background:#000;color:#fff;cursor:pointer}.sv>img{width:100%;height:100%;object-fit:contain}
.svh{position:absolute;top:14px;left:12px;right:12px;display:flex;align-items:center;gap:8px;font-weight:700}.svh img{width:30px;height:30px;border-radius:50%;object-fit:cover}.svh span{margin-left:auto;font-size:20px}
.svl{position:absolute;top:6px;left:8px;right:8px;height:3px;background:#fff6;border-radius:2px}.svl::after{content:"";display:block;width:35%;height:100%;background:#fff;border-radius:2px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:20}
.ic span,.nav span{cursor:pointer}
:root{--fill:#eff0f4;--pill:#d6d9f0;--blue:#4a5cf6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fill:#26262c;--pill:#2a2b3a}}
:root[data-theme="dark"]{--fill:#26262c;--pill:#2a2b3a}
.phone{min-height:780px}
.sb{display:flex;justify-content:space-between;align-items:center;padding:14px 26px 6px;font-size:16px}
.sb>span{display:flex;gap:6px;align-items:center}
.bat{position:relative;width:26px;height:13px;border-radius:4px;background:var(--line);overflow:hidden;text-align:center;font-size:9px;line-height:13px;font-weight:700;color:var(--phone)}
.bat b{position:absolute;left:0;top:0;bottom:0;background:var(--ink)}
.bat i{position:relative;font-style:normal}
.ct{flex:1}
.ph{display:flex;align-items:center;gap:16px;padding:10px 16px}
.ph svg{width:28px;height:28px;display:block}
.pid{flex:1;display:flex;align-items:center;gap:5px;font-size:20px;justify-content:center}
.pid svg{width:18px;height:18px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f33}
.hd2{display:flex;gap:18px;padding:0 16px;align-items:flex-start}
.pav{position:relative;flex:none;width:88px;height:88px;margin-top:24px}
.pav .av{width:88px;height:88px}
.ph0{display:flex;align-items:center;justify-content:center;background:var(--fill);color:var(--blue)}
.note{position:absolute;left:-4px;top:-26px;max-width:120px;padding:7px 12px;border-radius:16px;background:var(--phone);box-shadow:0 2px 10px #0002;font-size:13px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:2}
.pr{flex:1;padding-top:8px}
.nm{font-weight:600;font-size:15px;margin-bottom:8px}
.stats2{display:flex;gap:22px}.stats2 div{font-size:14px}.stats2 b{display:block;font-size:20px;font-weight:600}
.bi{padding:12px 16px 0;font-size:14px;white-space:pre-wrap}
.ab{display:flex;gap:8px;padding:16px}
.ab div{flex:1;display:flex;justify-content:center;padding:10px;border-radius:12px;background:var(--fill);font-weight:600;font-size:14px}
.ab .sm{flex:none;width:48px}.ab svg{width:22px;height:22px}
.h2{display:flex;gap:16px;padding:0 16px 14px;overflow-x:auto;-webkit-touch-callout:none;user-select:none}
.h2>div{flex:none;width:68px;text-align:center;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.rg{width:64px;height:64px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;padding:3px;overflow:hidden}
.rg img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.rg svg{width:30px;height:30px}
.ptabs div{padding:12px}
.emp{text-align:center;padding:26px 20px 20px}.emp h3{font-size:20px;margin:14px 0 4px}.emp p{margin:0 0 16px;color:var(--mute);font-size:14px}
.mk{width:100%;border:0;border-radius:14px;background:var(--blue);color:#fff;padding:13px;font:inherit;font-weight:600}
.pill{display:flex;justify-content:space-around;align-items:center;margin:8px 14px 14px;padding:8px 6px;border-radius:34px;background:var(--pill);box-shadow:0 6px 20px #0002}
.pill>div{position:relative;display:flex;padding:10px 14px;border-radius:26px;color:var(--ink);cursor:pointer}
.pill>.on{background:#0002}
.pill .dot{position:absolute;right:8px;top:8px}
.pill img,.pill i{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--fill);display:block}
.pill .on svg{stroke-width:2.4}
.svh span+span{margin-left:12px}
.sb{padding:16px 30px 4px 36px;font-size:17px;font-weight:600}
.ph{padding:8px 16px 6px;gap:14px}
.pid{font-size:22px}.pid b{font-weight:700}
.dot{width:9px;height:9px}
.stats2{display:grid;grid-template-columns:repeat(3,1fr)}
.stats2 b{font-size:18px}
.note{overflow:visible;padding:8px 14px;max-width:none}
.note span{display:block;max-width:92px;overflow:hidden;text-overflow:ellipsis}
.note::after{content:"";position:absolute;left:26px;bottom:-9px;width:12px;height:12px;border-radius:50%;background:var(--phone);border:1px solid var(--line)}
.ab{gap:6px;padding:12px 16px}
.ab div{height:34px;align-items:center;padding:0;border-radius:10px;font-size:14px}
.ab .sm{width:40px}
.h2{gap:14px;padding:4px 16px 14px}
.rg{border:2.5px solid #dcdfe8}
.ptabs{border-top:0;border-bottom:1px solid var(--line)}
.ptabs div{position:relative;border-bottom:0;padding:12px;color:var(--mute)}
.ptabs .on{color:var(--ink)}
.ptabs .on::after{content:"";position:absolute;left:50%;bottom:-1px;width:64px;margin-left:-32px;height:3px;background:var(--ink)}
.emp{padding:34px 24px 26px}
.mk{height:46px;padding:0;border-radius:16px}
.pill{margin:6px 22px 14px;padding:6px;border-radius:32px;box-shadow:0 4px 18px #0002;backdrop-filter:blur(14px)}
.pill>div{padding:12px 18px;border-radius:28px}
.pill>.on{background:#0000001f}
.pill .dot{right:13px;top:11px;width:8px;height:8px}
.pill i{border:2px solid var(--ink);background:var(--fill)}
.stats2 div{line-height:1.2}
.stats2 b{margin-bottom:1px}
.ph1{color:var(--mute);font-weight:400}
.sb [data-ed],.bat{cursor:pointer}
.stats2 b{font-size:16px;font-weight:600}
.stats2 div{font-size:13px}
.pav{margin-top:16px}
.note{top:-22px}
.pr{padding-top:0}
.nm{font-size:15px;font-weight:600;margin-bottom:6px}
.ph{padding-bottom:2px}
.pid b{position:relative;display:inline-block}
.pid .aft,.pid .bef{position:absolute;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:5px}
.pid .aft{left:100%;margin-left:6px}
.pid .bef{right:100%;margin-right:6px}
.ab{margin-top:16px}
.sadd{background:#000!important;color:#fff!important}
.phone.blk{background:#000;color:#fff;--phone:#000;--ink:#fff;--line:#333}
.phone.blk .ct{display:flex;flex-direction:column}
.phone.blk .sv{flex:1;height:auto}
.phone.blk .sv>img{position:absolute;inset:0}
.who2{flex:1;line-height:1.3}.who2 small{margin-left:8px}
.mus{font-weight:400;font-size:13px;display:flex;align-items:center;gap:6px}
.svh{align-items:flex-start}.svh img{width:36px;height:36px}.svh>span{font-size:22px;line-height:1}
.md{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.mb{background:var(--card);color:var(--ink);border-radius:16px;padding:18px;width:100%;max-width:340px}
.mb h3{margin:0 0 6px;font-size:16px}.mb p{margin:0}
.mr{display:flex;gap:8px;margin-top:14px}
.mr button{flex:1;padding:11px;border:0;border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-weight:600}
.mr .p{background:var(--acc);color:#fff}
.sadd{background:var(--ink);color:var(--phone)}
.asx{position:absolute;left:12px;right:12px;bottom:14px;z-index:21}
.asx>div{background:var(--phone);border-radius:22px;overflow:hidden;margin-top:8px}
.asx .r{padding:18px;text-align:center;font-size:17px;cursor:pointer}
.asx .r+.r{border-top:1px solid var(--line)}
.pill svg{width:24px;height:24px}
.pill img,.pill i{width:24px;height:24px}
.pill>div{padding:10px 16px}
.pill .dot{right:10px;top:8px}
.phone{position:relative}
.bd{position:absolute;inset:0;background:#0006;z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;background:var(--phone);border-radius:22px 22px 0 0;padding:8px 0 22px;box-shadow:0 -4px 24px #0003}
.gr{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.ar{display:flex;align-items:center;gap:12px;padding:10px 20px;cursor:pointer}
.ar img,.ar i{width:44px;height:44px;border-radius:50%;object-fit:cover;background:var(--fill);display:flex;align-items:center;justify-content:center;font-style:normal;flex:none}
.ar span{flex:1;line-height:1.3}.ar small{color:var(--mute)}
.ar u{text-decoration:none;color:var(--blue);font-weight:700}
.hd2{margin-top:10px}.pav{margin-top:2px}.pr{padding-top:20px}.note{top:-16px}
.pav .av{position:relative;z-index:1}
.pav.ring::before{content:"";position:absolute;inset:-5px;border-radius:50%;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
.pav.ring .av{border:3px solid var(--phone);cursor:pointer}
.sadd{position:absolute;right:-2px;bottom:-2px;width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;border:3px solid var(--phone);display:flex;align-items:center;justify-content:center;font-size:17px;line-height:1;z-index:3;cursor:pointer}
.svl2{position:absolute;top:6px;left:8px;right:8px;display:flex;gap:4px;z-index:2}
.svl2 b{flex:1;height:3px;border-radius:2px;background:#fff5}
.svl2 b.f{background:#fff}
.svl2 b.a{background:linear-gradient(#fff,#fff) no-repeat #fff5;background-size:0 100%;animation:fill 5s linear forwards}
@keyframes fill{to{background-size:100% 100%}}
.svh{z-index:2;top:16px}.svh small{font-weight:400;opacity:.8}
.scap{position:absolute;left:16px;right:16px;bottom:24px;text-align:center;color:#fff;font-size:16px;text-shadow:0 1px 4px #000}
</style>
</head>
<body>
<div class="top"><button id="t1" class="on">편집</button><button id="t2">미리보기</button></div>
<main>
<section id="edit">
  <div class="card">
    <h2>계정</h2>
    <select id="accSel" style="width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit"></select>
    <div class="row"><button class="btn" id="accAdd">계정 추가</button><button class="btn g" id="accDel">이 계정 삭제</button></div>
    <p class="hint">선택한 계정이 아래 편집과 미리보기에 적용돼요. 미리보기에서는 아이디 옞 화살표를 눌러 바꿀 수 있어요.</p>
  </div>
  <div class="card">
    <h2>프로필</h2>
    <label>프로필 사진</label><input type="file" accept="image/*" id="avIn">
    <label>아이디</label><input id="id" placeholder="my_account">
    <label>이름</label><input id="name" placeholder="표시 이름">
    <label>소개글</label><textarea id="bio"></textarea>
    <label>노트 (프로필 말풍선)</label><input id="note" placeholder="호기심 폭발...">
    <div class="row"><div><label>상태바 시각</label><input id="time" placeholder="9:41"></div><div><label>배터리 %</label><input id="batt" placeholder="100"></div></div>
    <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="lock" style="width:auto"> 비공개 계정 (자물쇠 표시)</label>
    <div class="row"><div><label>팔로워</label><input id="fo" value="0"></div><div><label>팔로잉</label><input id="fi" value="0"></div></div>
    <p class="hint">숫자 대신 1.2만처럼 글자도 넣을 수 있어요.</p>
  </div>
  <div class="card">
    <h2>게시물</h2>
    <label>사진</label><input type="file" accept="image/*" id="pIn">
    <label>내용</label><textarea id="pCap"></textarea>
    <div class="row"><div><label>좋아요</label><input id="pLk" value="0"></div><div><label>작성일</label><input id="pDt" placeholder="2시간 전"></div></div>
    <button class="btn" id="pAdd">게시물 추가</button>
    <div id="pList"></div>
  </div>
  <div class="card">
    <h2>하이라이트</h2>
    <label>커버 사진</label><input type="file" accept="image/*" id="hIn">
    <label>이름</label><input id="hName" placeholder="여행">
    <button class="btn" id="hAdd">하이라이트 추가</button>
    <div id="hList"></div>
  </div>
  <div class="card">
    <h2>스토리</h2>
    <label>사진</label><input type="file" accept="image/*" id="sIn">
    <label>문구 (선택)</label><input id="sCap">
    <label>가수 (선택)</label><input id="sAr"><label>노래 제목 (선택)</label><input id="sSo">
    <label>시간</label><input id="sTm" placeholder="방금 전">
    <button class="btn" id="sAdd">스토리 추가</button>
    <div id="sList"></div>
  </div>
  <div class="card">
    <h2>저장</h2>
    <p class="hint">내용은 이 브라우저에 자동 저장돼요. 사진이 많으면 저장이 안 될 수 있으니 백업 파일을 받아두세요.</p>
    <div class="row"><button class="btn g" id="exp">백업 받기</button><button class="btn g" id="imp">백업 불러오기</button></div>
    <input type="file" id="impIn" accept=".json" hidden>
    <button class="btn g" id="reset" style="width:100%">전체 초기화</button>
  </div>
</section>
<section id="prev" hidden><div class="wrap"><div class="phone" id="phone"></div></div></section>
</main>
<input type="file" accept="image/*" id="gIn" style="position:fixed;left:-9999px;top:0;opacity:0">
<script>
var KEY="insta-maker-v1";
var S={id:"my_account",name:"",bio:"",fo:"0",fi:"0",av:"",posts:[],hl:[]};
var tmp={av:"",p:"",h:""},view=-1,cur="profile",pt="grid",sv=null;
function toast(m){var t=document.createElement("div");t.className="toast";t.textContent=m;document.body.appendChild(t);setTimeout(function(){t.remove()},1800)}
